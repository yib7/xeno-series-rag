[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xeno-rag"
version = "0.1.0"
description = "Local-first RAG chatbot over the Xeno Series Wiki"
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.31",
    "mwparserfromhell>=0.6",
    "pyyaml>=6",
    "numpy>=1.26",
    "tqdm>=4.66",
    "sentence-transformers>=3.0",
    "chromadb>=0.5",
    "google-genai>=0.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# DirectML GPU embedding path (AMD on Windows). CPU fallback works without these.
gpu = ["optimum[onnxruntime]>=1.20", "onnxruntime-directml>=1.17"]
dev = ["pytest>=8", "pytest-mock>=3.12", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["xeno_rag*"]

[tool.pytest.ini_options]
markers = ["live: hits the real wiki API; skipped by default"]
addopts = "-m 'not live'"
testpaths = ["tests"]
