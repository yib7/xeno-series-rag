[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xeno-rag"
version = "1.3.3"
description = "Local-first RAG chatbot over the Xeno Series Wiki"
license = "MIT"                            # code only; wiki-derived data is CC-BY-SA 4.0 (LICENSE-DATA.md)
license-files = ["LICENSE", "LICENSE-DATA.md"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "requests>=2.31",
    "mwparserfromhell>=0.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6",
    "numpy>=1.26",
    "tqdm>=4.66",
    "sentence-transformers>=5.0",
    "transformers>=4.51",                      # Qwen3 architecture (Qwen3-Embedding) support
    "chromadb>=1.5.9,<1.6",                    # index-format pin: the prebuilt store (data-v2) is built
                                               # with 1.5.9; 1.6+ may not read it. Keep in sync w/ the lock.
    "google-genai>=0.3",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
# DirectML GPU embedding path (AMD on Windows). CPU fallback works without these.
gpu = ["optimum[onnxruntime]>=1.20", "onnxruntime-directml>=1.17"]
dev = ["pytest>=8", "pytest-mock>=3.12", "httpx>=0.27", "ruff==0.16.1"]

[tool.setuptools.packages.find]
include = ["xeno_rag*"]

[tool.setuptools.package-data]
# Explicit globs on purpose: static/art/* holds gitignored copyrighted images that must never ship,
# so no static/** wildcard. Fonts ship with their OFL license texts + attribution README (P2-11).
"xeno_rag.web" = [
    "static/*.html", "static/*.js",
    "static/fonts/*.woff2", "static/fonts/*.txt", "static/fonts/*.md",
]

[tool.pytest.ini_options]
markers = ["live: hits the real wiki API; skipped by default"]
addopts = "-m 'not live'"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
# No explicit `select`: relies on ruff's own default rule set, which is why the dev dependency above
# pins an exact ruff version rather than a floor. Ruff's defaults have changed between minor releases
# (0.16 added isort/bandit/pylint/etc. rules on top of the old pyflakes+pycodestyle-subset baseline),
# so an unpinned `ruff>=X` can pass locally and fail CI purely from installing a newer ruff.
