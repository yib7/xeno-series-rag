name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Lint + Python tests + frontend JS tests on every platform the README claims: Linux and Windows.
  # The Windows leg is the project's primary development platform; the Linux leg is the clean-clone
  # check. macOS is not claimed, so it is not run.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # The embedding / reranker tests pull small models from Hugging Face on first run; cache them so
      # subsequent runs are fast (no API key is needed, these are open models).
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (Python)
        run: pytest -q

      - name: Test (frontend JS)
        run: node --test tests/js/*.test.mjs

  # Runs the README "Setup" and "Quick start: prebuilt data" steps literally on a clean runner, one
  # job per OS using that OS's variant of each README command, in one shell session (the README
  # activates the venv once and every later command relies on it). It downloads the real prebuilt
  # vector store release asset (just over 1 GB, ~2.2 GB extracted) and rebuilds BM25 from it, then
  # checks the app's own /health reports a serviceable store. No API key is set, so nothing billed
  # is called: /health never touches the embedder or any LLM.
  readme-setup:
    name: README setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # README: "python3.12 -m venv .venv", "source .venv/bin/activate", "pip install -e \".[dev]\"",
      # then "python -m scripts.setup".
      - name: README setup steps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"
          python -c "import sys; assert sys.prefix != sys.base_prefix, 'venv is not active'"
          python -m scripts.setup

      # README (Windows variant, PowerShell): "py -3.12 -m venv .venv", ".venv\Scripts\activate".
      - name: README setup steps (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.12 -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\activate
          pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sys; assert sys.prefix != sys.base_prefix, 'venv is not active'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The README's next step is to start the app; /health is its own smoke target for the store.
      - name: Check the installed store through the app
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          "$PY" - <<'PY'
          from fastapi.testclient import TestClient
          from xeno_rag.web.app import app

          body = TestClient(app).get("/health").json()
          print(body)
          assert body["status"] == "ok", body
          assert body["store"]["chunks"] > 250_000, body["store"]
          assert body["bm25"]["rows"] == body["store"]["chunks"], body
          PY
