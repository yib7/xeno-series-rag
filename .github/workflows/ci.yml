name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Lint + Python tests + frontend JS tests on every platform the README claims: Linux and Windows.
  # The Windows leg is the project's primary development platform; the Linux leg is the clean-clone
  # check. macOS is not claimed, so it is not run.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Only the `model` integration test (below) pulls a model from Hugging Face; cache it so
      # subsequent runs are fast (no API key is needed, it is an open model). The default suite uses
      # deterministic fakes and touches neither the network nor the hub.
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (Python)
        run: pytest -q

      # Real Qwen3-Embedding end to end: the one test that needs the model download (marker `model`).
      - name: Test (real embedder, integration)
        run: pytest -q -m model

      - name: Test (frontend JS)
        run: node --test tests/js/*.test.mjs

  # Runs the README Setup steps (Step 1 to Step 5, then Step 8) literally on a clean runner, one job
  # per OS using that OS's variant of each README command, in one shell session (the README activates
  # the venv once and every later command relies on it). Step 4 downloads the real prebuilt vector
  # store release asset (just over 1 GB, ~2.2 GB extracted) and rebuilds BM25 from it. Steps 6, 7, 9
  # and 10 need a person or an API key and are not run: no key is ever set here, so nothing billed is
  # called, and /health never touches the embedder or any LLM. When the README steps change, change
  # this job in the same commit.
  readme-setup:
    name: README setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # README Step 1 "python3.12 -m venv .venv", Step 2 "source .venv/bin/activate",
      # Step 3 `pip install -e ".[dev]"`, Step 4 "python -m scripts.setup", Step 5 "cp .env.example .env".
      - name: README Steps 1 to 5 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install -e ".[dev]"
          python -c "import sys; assert sys.prefix != sys.base_prefix, 'venv is not active'"
          python -m scripts.setup
          cp .env.example .env

      # README Windows variants (PowerShell): "py -3.12 -m venv .venv", ".venv\Scripts\activate",
      # "copy .env.example .env".
      - name: README Steps 1 to 5 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          py -3.12 -m venv .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\activate
          pip install -e ".[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import sys; assert sys.prefix != sys.base_prefix, 'venv is not active'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m scripts.setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          copy .env.example .env

      # README Step 8 starts the web UI with "python -m uvicorn xeno_rag.web.app:app --port 8000"
      # (the venv's interpreter here, since activation does not carry across steps). Step 9 opens the
      # page; this check requests it and the app's own /health instead of a browser.
      - name: README Step 8, start the web UI and check the installed store
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          "$PY" -m uvicorn xeno_rag.web.app:app --port 8000 &
          SERVER=$!
          "$PY" - <<'PY'
          import json
          import time
          import urllib.request

          def get(path):
              for _ in range(60):
                  try:
                      return urllib.request.urlopen("http://127.0.0.1:8000" + path, timeout=5)
                  except OSError:
                      time.sleep(1)
              raise SystemExit(f"server never answered {path}")

          page = get("/")
          assert page.status == 200, page.status
          body = json.load(get("/health"))
          print(body)
          assert body["status"] == "ok", body
          assert body["store"]["chunks"] > 250_000, body["store"]
          assert body["bm25"]["rows"] == body["store"]["chunks"], body
          PY
          kill "$SERVER" || true
