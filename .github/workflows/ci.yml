name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # The embedding / reranker tests pull small models from Hugging Face on first run; cache them so
      # subsequent runs are fast (no API key is needed — these are open models).
      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: hf-${{ runner.os }}-

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Test (Python)
        run: pytest -q

      - name: Test (frontend JS)
        run: node --test tests/js/*.test.mjs
