<svg viewBox="0 0 760 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="title">Xeno RAG architecture — big picture</title>
  <desc id="desc">Two parallel halves. Offline (build once): MediaWiki API, harvest titles, fetch rendered HTML, parse, chunk, embed into ChromaDB, build a BM25 index. Online (per question): question with game filter, retrieval query, dense and lexical search, RRF fusion, cross-encoder rerank, grounded prompt, Gemini generation, answer with deduped source links.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>
      .box{ fill:#21262d; stroke:#30363d; stroke-width:1.5; }
      .store{ fill:#21262d; stroke:#2dd4bf; stroke-width:1.6; }
      .t{ fill:#e6edf3; font-weight:600; font-size:15.5px; text-anchor:middle; }
      .s{ fill:#9aa4af; font-size:12px; text-anchor:middle; }
      .cap{ font-size:13px; font-weight:700; letter-spacing:0.09em; }
      .arrow{ fill:none; stroke:#8b949e; stroke-width:1.8; }
    </style>
  </defs>

  <rect x="3" y="3" width="754" height="674" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="70" y="56" class="cap" fill="#8b949e">OFFLINE  ·  BUILD ONCE</text>
  <text x="430" y="56" class="cap" fill="#2dd4bf">ONLINE  ·  PER QUESTION</text>

  <!-- arrows: left column -->
  <path class="arrow" d="M200,136 L200,158" marker-end="url(#ah)"/>
  <path class="arrow" d="M200,208 L200,230" marker-end="url(#ah)"/>
  <path class="arrow" d="M200,280 L200,302" marker-end="url(#ah)"/>
  <path class="arrow" d="M200,352 L200,374" marker-end="url(#ah)"/>
  <path class="arrow" d="M200,424 L200,446" marker-end="url(#ah)"/>
  <path class="arrow" d="M200,496 L200,518" marker-end="url(#ah)"/>
  <!-- arrows: right column -->
  <path class="arrow" d="M560,136 L560,158" marker-end="url(#ah)"/>
  <path class="arrow" d="M560,208 L497,230" marker-end="url(#ah)"/>
  <path class="arrow" d="M560,208 L623,230" marker-end="url(#ah)"/>
  <path class="arrow" d="M491,280 L548,302" marker-end="url(#ah)"/>
  <path class="arrow" d="M629,280 L572,302" marker-end="url(#ah)"/>
  <path class="arrow" d="M560,352 L560,374" marker-end="url(#ah)"/>
  <path class="arrow" d="M560,424 L560,446" marker-end="url(#ah)"/>
  <path class="arrow" d="M560,496 L560,518" marker-end="url(#ah)"/>
  <path class="arrow" d="M560,568 L560,590" marker-end="url(#ah)"/>

  <!-- left column: offline -->
  <rect class="box" x="70" y="86" width="260" height="50" rx="10"/>
  <text class="t" x="200" y="107">MediaWiki API</text>
  <text class="s" x="200" y="125">the source wiki</text>

  <rect class="box" x="70" y="158" width="260" height="50" rx="10"/>
  <text class="t" x="200" y="179">harvest titles</text>
  <text class="s" x="200" y="197">every article title</text>

  <rect class="box" x="70" y="230" width="260" height="50" rx="10"/>
  <text class="t" x="200" y="251">fetch rendered HTML</text>
  <text class="s" x="200" y="269">+ wikitext for prose</text>

  <rect class="box" x="70" y="302" width="260" height="50" rx="10"/>
  <text class="t" x="200" y="323">parse</text>
  <text class="s" x="200" y="341">HTML tables + wikitext prose</text>

  <rect class="box" x="70" y="374" width="260" height="50" rx="10"/>
  <text class="t" x="200" y="395">chunk</text>
  <text class="s" x="200" y="413">prose + infobox sentences</text>

  <rect class="store" x="70" y="446" width="260" height="50" rx="10"/>
  <text class="t" x="200" y="467">embed → ChromaDB</text>
  <text class="s" x="200" y="485">vectors · cosine</text>

  <rect class="store" x="70" y="518" width="260" height="50" rx="10"/>
  <text class="t" x="200" y="539">BM25 index</text>
  <text class="s" x="200" y="557">SQLite FTS5 · lexical</text>

  <!-- right column: online -->
  <rect class="box" x="430" y="86" width="260" height="50" rx="10"/>
  <text class="t" x="560" y="107">question</text>
  <text class="s" x="560" y="125">+ game filter</text>

  <rect class="box" x="430" y="158" width="260" height="50" rx="10"/>
  <text class="t" x="560" y="188">retrieval query</text>

  <rect class="store" x="430" y="230" width="123" height="50" rx="10"/>
  <text class="t" x="491" y="251">dense</text>
  <text class="s" x="491" y="269">ChromaDB</text>

  <rect class="store" x="567" y="230" width="123" height="50" rx="10"/>
  <text class="t" x="628" y="251">lexical</text>
  <text class="s" x="628" y="269">BM25 / FTS5</text>

  <rect class="box" x="430" y="302" width="260" height="50" rx="10"/>
  <text class="t" x="560" y="323">RRF fusion</text>
  <text class="s" x="560" y="341">of both rankings</text>

  <rect class="box" x="430" y="374" width="260" height="50" rx="10"/>
  <text class="t" x="560" y="395">cross-encoder rerank</text>
  <text class="s" x="560" y="413">top candidates</text>

  <rect class="box" x="430" y="446" width="260" height="50" rx="10"/>
  <text class="t" x="560" y="467">grounded prompt</text>
  <text class="s" x="560" y="485">context + rules</text>

  <rect class="box" x="430" y="518" width="260" height="50" rx="10"/>
  <text class="t" x="560" y="539">Gemini generation</text>
  <text class="s" x="560" y="557">pluggable LLM</text>

  <rect class="box" x="430" y="590" width="260" height="50" rx="10"/>
  <text class="t" x="560" y="611">answer + sources</text>
  <text class="s" x="560" y="629">deduped links</text>
</svg>
