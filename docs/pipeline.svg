<svg viewBox="0 0 620 864" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="title">Xeno RAG pipeline</title>
  <desc id="desc">An offline index-build lane (MediaWiki API to harvest_titles, fetch, parse_html.run_hybrid, chunk, into a ChromaDB vector store and a SQLite FTS5 BM25 store) feeding a per-query serving lane (question to retrieve, rerank, grounded prompt to LLM, answer with sources).</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>
      .box{ fill:#21262d; stroke:#30363d; stroke-width:1.5; }
      .store{ fill:#21262d; stroke:#2dd4bf; stroke-width:1.6; }
      .t{ fill:#e6edf3; font-weight:600; font-size:16px; text-anchor:middle; }
      .s{ fill:#9aa4af; font-size:12.5px; text-anchor:middle; }
      .cap{ font-size:13px; font-weight:700; letter-spacing:0.09em; }
      .arrow{ fill:none; stroke:#8b949e; stroke-width:1.8; }
    </style>
  </defs>

  <rect x="3" y="3" width="614" height="858" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <rect x="14" y="24" width="592" height="478" rx="14" fill="#161b22" stroke="#262c36" stroke-width="1"/>
  <text x="34" y="48" class="cap" fill="#8b949e">OFFLINE  ·  BUILD THE INDEX (ONE TIME)</text>
  <rect x="14" y="514" width="592" height="330" rx="14" fill="#102a26" stroke="#1f5e54" stroke-width="1"/>
  <text x="34" y="538" class="cap" fill="#2dd4bf">PER QUERY  ·  ANSWER A QUESTION</text>

  <path class="arrow" d="M310,112 L310,134" marker-end="url(#ah)"/>
  <path class="arrow" d="M310,184 L310,206" marker-end="url(#ah)"/>
  <path class="arrow" d="M310,256 L310,278" marker-end="url(#ah)"/>
  <path class="arrow" d="M310,328 L310,350" marker-end="url(#ah)"/>
  <path class="arrow" d="M310,400 L187,424" marker-end="url(#ah)"/>
  <path class="arrow" d="M310,400 L433,424" marker-end="url(#ah)"/>
  <path class="arrow" d="M175,480 L298,556" marker-end="url(#ah)"/>
  <path class="arrow" d="M445,480 L322,556" marker-end="url(#ah)"/>
  <path class="arrow" d="M150,581 L158,581" marker-end="url(#ah)"/>
  <path class="arrow" d="M310,606 L310,628" marker-end="url(#ah)"/>
  <path class="arrow" d="M310,678 L310,700" marker-end="url(#ah)"/>
  <path class="arrow" d="M310,750 L310,772" marker-end="url(#ah)"/>

  <rect class="box" x="160" y="62" width="300" height="50" rx="10"/>
  <text class="t" x="310" y="83">MediaWiki API</text>
  <text class="s" x="310" y="101">source: xenoserieswiki.org</text>

  <rect class="box" x="160" y="134" width="300" height="50" rx="10"/>
  <text class="t" x="310" y="155">harvest_titles</text>
  <text class="s" x="310" y="173">titles.jsonl</text>

  <rect class="box" x="160" y="206" width="300" height="50" rx="10"/>
  <text class="t" x="310" y="227">fetch</text>
  <text class="s" x="310" y="245">HTML for stat pages · wikitext for rest</text>

  <rect class="box" x="160" y="278" width="300" height="50" rx="10"/>
  <text class="t" x="310" y="299">parse_html.run_hybrid</text>
  <text class="s" x="310" y="317">articles.jsonl</text>

  <rect class="box" x="160" y="350" width="300" height="50" rx="10"/>
  <text class="t" x="310" y="371">chunk</text>
  <text class="s" x="310" y="389">chunks.jsonl</text>

  <rect class="store" x="60" y="424" width="230" height="56" rx="10"/>
  <text class="t" x="175" y="448">ChromaDB vectorstore</text>
  <text class="s" x="175" y="466">dense · cosine</text>

  <rect class="store" x="330" y="424" width="230" height="56" rx="10"/>
  <text class="t" x="445" y="448">SQLite FTS5</text>
  <text class="s" x="445" y="466">lexical BM25</text>

  <rect class="box" x="20" y="556" width="130" height="50" rx="10"/>
  <text class="t" x="85" y="587">question</text>

  <rect class="box" x="160" y="556" width="300" height="50" rx="10"/>
  <text class="t" x="310" y="577">retrieve</text>
  <text class="s" x="310" y="595">dense + BM25 · RRF fusion</text>

  <rect class="box" x="200" y="628" width="220" height="50" rx="10"/>
  <text class="t" x="310" y="659">rerank</text>

  <rect class="box" x="160" y="700" width="300" height="50" rx="10"/>
  <text class="t" x="310" y="731">grounded prompt → LLM</text>

  <rect class="box" x="150" y="772" width="320" height="50" rx="10"/>
  <text class="t" x="310" y="793">answer + sources</text>
  <text class="s" x="310" y="811">CLI · web (SSE)</text>
</svg>
