# Xeno RAG configuration. Set your own contact in user_agent before any live pull (wiki etiquette).

# --- MediaWiki API ---
base_url: "https://www.xenoserieswiki.org/w/api.php"
user_agent: "XenoRAG/0.1 (+https://github.com/yib7/xeno-series-rag)"
request_delay_seconds: 5      # delay between content-fetch (action=query) calls; conservative
batch_size: 50                # titles per content-fetch request
html_batch_size: 100          # rendered-HTML pages per resume batch (action=parse is 1 page/call)
# robots.txt Crawl-delay: 5 governs *crawlers* (which it Disallows from /w/ entirely); the API is a
# legitimate client endpoint governed by MediaWiki API etiquette: descriptive UA + maxlag + SERIAL
# requests (no fixed delay required). maxlag below is the real adaptive safeguard. A 10-page probe at
# 1s saw ~0.46s median latency, 0 maxlag backoffs. So the HTML pull uses a faster (still serial) delay.
html_request_delay_seconds: 0.5  # action=parse cadence (~1 req/s); maxlag still sheds load under stress
maxlag: 5                     # MediaWiki maxlag param; server sheds load under this

# --- Embeddings ---
# Qwen3-Embedding-0.6B: 1024-dim, decoder with last-token pooling, instruction-tuned queries
# (cosine-normalized). Query embedding runs on CPU at serve time (~0.2s per question);
# the heavy one-time corpus indexing runs on a Colab GPU.
embed_model: "Qwen/Qwen3-Embedding-0.6B"
embed_device: "cpu"           # cpu | auto | directml. Qwen is a decoder with no reliable DirectML/
                              # ONNX path; a single query embeds on CPU well under a second, so cpu.
# Qwen's last-token pooling needs LEFT-padded tokenization (matters when batching docs at index
# time; harmless for single serve-time queries). Threaded to sentence-transformers at load.
embed_tokenizer_kwargs:
  padding_side: "left"
# Instruction prepended to QUERIES only (never to stored docs). It MUST match the prompt the
# vectorstore was built with on Colab, or query and document vectors land in different spaces.
# Qwen's format is "Instruct: <task>\nQuery:" with the question concatenated directly after.
query_instruction: "Instruct: Given a web search query, retrieve relevant passages that answer the query\nQuery:"

# --- Vector store / retrieval ---
collection_name: "xeno_wiki"
top_k: 16                      # chunks retrieved per question; higher = more cross-page synthesis
max_chunks_per_page: 4        # cap chunks kept per page so one long page can't crowd out other sources
# Note: retrieval latency is flat in these two (the candidate pool is fixed at hybrid_candidates /
# rerank_candidates); they only trim the reranked list. Chunks are small (median ~45 tokens), so even
# top_k=20/cap=6 is ~1.5k context tokens vs Gemini's 1M window. The real lever is precision vs. page
# diversity: raise cap for single-entity depth (stat pages have ~15 facet chunks), raise top_k with it
# to keep page breadth. The page's infobox (Location/Species/Level) is always kept within the cap.

# --- Answer tiers (auto-routed per question by Jev; CLI --tier forces one) ---
# Each tier pairs a Gemini model (and thinking level) with a retrieval depth, so "how hard the model
# thinks" and "how much of the wiki it reads" move together. Measured on sample questions, Gemini
# sees about 15 / 29 / 62 distinct articles for fast / thinking / scholar. Chunks are tiny (~45 tok
# median), so even scholar's 96x10 profile is a few thousand context tokens; its real cost is rerank
# latency (the CPU cross-encoder scores 224 candidates). Keys other than `model` override the base
# retrieval settings above; `model` becomes gemini_model. Applied by router.apply_tier.
answer_tiers:
  fast:                         # single-fact lookups: a stat, level, location, drop, who/what is X
    model: "gemini-3.5-flash-lite"
    top_k: 20
    max_chunks_per_page: 5
  thinking:                     # multi-topic explanations and comparisons; also the fallback tier
    model: "gemini-3.8-flash"
    top_k: 40
    max_chunks_per_page: 6
    hybrid_candidates: 120
    rerank_candidates: 100
  scholar:                      # broad cross-game / whole-series synthesis
    model: "gemini-3.8-flash"
    thinking_level: "high"      # low | medium (Gemini default) | high
    top_k: 96                   # breadth is the lever: far more cross-page chunks than thinking,
    max_chunks_per_page: 10     #   with a modest per-page cap so one page can't crowd out breadth
    hybrid_candidates: 256
    rerank_candidates: 224

# --- Tier router (Jev by TypeSafe AI: typed decisions, ~$0.042 per 1M input tokens) ---
# Needs TYPESAFE_API_KEY in .env. Without a key, on any error, or below min_confidence, every
# question uses fallback_tier. provider: fixed skips Jev entirely (offline, no key needed).
router:
  provider: "jev"               # jev | fixed
  model: "jev-latest"
  url: "https://api.typesafe.ai/v1/systemone"
  fallback_tier: "thinking"
  min_confidence: 0.5
  timeout_seconds: 2
  # Gates (eval/run_jev_gates_eval.py, 2026-09-25: 200 gold + 30 off-topic + 20 not-covered cases).
  off_topic_gate: true          # non-Xeno messages get a canned reply, no retrieval or Gemini
  off_topic_confidence: 0.7     # 0/200 gold blocked and 30/30 off-topic caught at 0.7-0.9
  answerability_check: true     # post-rerank coverage check: escalate once to scholar, then decline
  decline_confidence: 0.9       # gold false-decline 2.5% at 0.7, 2.0% at 0.8, 1.0% at 0.9
  answerability_passages: 8     # top reranked chunks sent to Jev, each trimmed to 600 chars

# --- Hybrid retrieval (dense + BM25, then optional cross-encoder rerank) ---
use_bm25: true                # fuse lexical BM25 hits with dense — fixes exact proper-noun/concept recall
use_reranker: true            # cross-encoder reorders the fused candidates for final precision
hybrid_candidates: 60         # candidates pulled from EACH of dense + BM25 before fusion
rrf_k: 60                     # Reciprocal Rank Fusion constant (higher = flatter rank weighting)
rerank_candidates: 50         # top fused candidates handed to the cross-encoder
# Small, fast English cross-encoder (CPU-friendly on the AMD card). Higher quality but slower:
# "BAAI/bge-reranker-base". First use downloads the weights.
rerank_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
# Shared-cast filter fallback: when a hard per-game filter excludes the very page a question is about
# (a Xenosaga character tagged for only 2 of the 3 episodes, asked under the third — his page is dense
# rank 1 unfiltered but the episode filter drops it), retrieval relaxes the filter. Trigger = the best
# in-filter dense distance exceeds the best UNFILTERED distance by >= this many cosine units (i.e. a
# strictly closer page exists outside the filter). Measured gaps: ~0.122 for the starved Mizrahi/XS2
# case vs 0.000-0.057 for well-populated filters, so 0.10 fires only on a genuine exclusion and leaves
# well-populated filters untouched. Raise toward 1.0 to effectively disable; lower to relax more eagerly.
retrieve_relax_gap: 0.10

# --- Auto-merging (answer-time): give the LLM a full stat-page profile, not fragmented scraps ---
# A stat page (enemy/item) is split into ~15-19 tiny factblock chunks (~30 tok each), so retrieval
# hands the model 30-token scraps. When a retrieved chunk belongs to a "stat-fragmented" page, fold
# that page's siblings (infobox + stats + resistances + drops) into ONE coherent block before the
# prompt. Retrieval/embeddings are untouched — this only enriches what's sent to the model (no
# re-embed). Prose pages (few large chunks) pass through unchanged. See parent-document/auto-merging.
merge_stat_pages: true        # master toggle
merge_small_chars: 400        # a sibling chunk shorter than this counts as a "factblock" fragment
merge_min_small: 3            # page needs >= this many small siblings to be treated as stat-fragmented
merge_max_chars: 4000         # cap the merged profile (~1k tokens) so a 140-chunk page can't blow up

# --- Generation ---
llm_provider: "gemini"        # gemini (default) | mock
# Default model for tier-less paths such as eval --generate.
gemini_model: "gemini-3.8-flash"

# --- Paths (relative to repo root) ---
paths:
  titles: "data/raw/titles.jsonl"
  pages: "data/raw/pages"                      # legacy raw wikitext (action=query)
  checkpoint: "data/raw/checkpoint.json"
  # Only the pages with Lua-rendered stat/data tables need HTML (the decoded stats live only in the
  # rendered HTML; the other ~28k pages keep their clean wikitext-parsed prose). action=parse renders
  # one page per call, so we fetch just these ~7.6k rather than all 36k.
  html_titles: "data/raw/titles_stats.jsonl"
  html: "data/raw/html"                        # rendered HTML batches (action=parse), gzipped
  html_checkpoint: "data/raw/html_checkpoint.json"
  articles: "data/processed/articles.jsonl"
  chunks: "data/processed/chunks.jsonl"
  vectorstore: "data/vectorstore"
  bm25: "data/vectorstore/bm25.sqlite3"        # SQLite-FTS5 lexical index (built from the collection)
